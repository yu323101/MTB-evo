name: mtb-evo
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - python=3.9
  - pip
  # Bioinformatics tools
  - sickle-trim
  - bowtie2
  - samtools
  - varscan
  - fasttree
  # Perl
  - perl
  # Python packages (使用 pip 安装避免 channel 冲突)
  - pip:
    - biopython==1.81
    - typer
    - pydantic
    - pyyaml
  # Development
  - pytest
  - black
  - ruff
