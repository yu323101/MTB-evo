[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mtb-evo"
version = "0.1.0"
description = "Mycobacterium tuberculosis evolutionary analysis pipeline"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "Author", email = "author@example.com"}
]
keywords = ["bioinformatics", "tuberculosis", "evolution", "snp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    "typer>=0.9.0",
    "pydantic>=2.0.0",
    "biopython>=1.81",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
mtb-evo = "mtb_evo.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mtb_evo"]

[tool.black]
line-length = 100
target-version = ['py39']

[tool.ruff]
line-length = 100
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
