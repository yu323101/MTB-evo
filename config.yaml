# MTB-Evo 配置文件
# 结核杆菌进化分析流程配置

# 样本列表
# 方式1：直接在配置文件中列出
samples:
  - MD601
  - MD602
  - MD603
  - MD604
  - MD605
  - MD606

# 方式2：创建samples.txt文件，每行一个样本名
# samples.txt内容示例：
# MD601
# MD602
# ...

# 分析参数
depth: 10              # 平均测序深度阈值
threshold: 5           # 最小有效样本阈值（百分比）

# 输出目录
output_dir: "results"

# 参考基因组路径
reference:
  h37rv: "data/tb_h37rv.fasta"           # H37Rv参考基因组
  ancestor: "data/tb.ancestor.fasta"     # 祖先序列

# 脚本路径
scripts:
  pair_fixed_nostrandbias: "scripts/pair_fixed_nostrandbias.py"

# 外部工具路径（可选，如果已在PATH中可省略）
tools:
  fasttree: "FastTree"  # 或完整路径，如 "/usr/local/bin/FastTree"
